  - name: mouse_intestine
    batch_col: ["sample_name", "condition", "location"]
    label_col: cell_type
integration:
  - name: simbaoptuna
    conda: "/ubc/cs/research/beaver/projects/Single-cell-integration-metrics/CondaEnv/simba-env"
