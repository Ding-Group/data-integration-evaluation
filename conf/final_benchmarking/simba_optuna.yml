experiment: final_benchmark/simba_optuna
conda_location: "/ubc/cs/research/beaver/projects/yinian/miniconda3/etc/profile.d/conda.sh"
datasets:
  - name: human_pancreas_full
    batch_col: ["tech"]
    label_col: celltype
  - name: human_dkd
    batch_col: ["batch", "assay"]
    label_col: cell_type
  - name: snpatho_liver
    batch_col: ["sample_id", "processing_method"]
